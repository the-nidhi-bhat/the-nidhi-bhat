  <rect x="368" y="257" width="12" height="21" fill="#A5E9F5">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.55;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <circle cx="1140" cy="170" r="90" fill="url(#core)" opacity="0.5"/>
  <circle cx="1140" cy="170" r="26" fill="#22D3EE" opacity="0.14"/>
